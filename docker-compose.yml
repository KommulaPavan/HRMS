services:
  app:
    build: .
    container_name: portal_app
    ports:
      - "8080:8080"
    depends_on:
      - oracle-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: c##pavan
      SPRING_DATASOURCE_PASSWORD: pavan
      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_db
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: pavan
      ORACLE_DATABASE: XEPDB1
